name: Deploy Backend (Turborepo)

on:
  push:
    branches: [ main ]
    paths:
      - 'kbdl-turborepo/apps/kbdl-backend/**'
      - 'kbdl-turborepo/packages/db/**'
      - 'kbdl-turborepo/packages/validator/**'
      - 'kbdl-turborepo/pnpm-lock.yaml'
      - 'kbdl-turborepo/turbo.json'
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IP }}
          username: azureuser
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            export PATH="$PATH:/usr/local/bin"

            cd ~/app/kbdl/kbdl-turborepo

            echo "📥 Pull latest"
            git fetch origin
            git reset --hard origin/main

            echo "🧹 Clean old builds"
            rm -rf packages/db/dist
            rm -rf packages/validator/dist
            rm -rf apps/kbdl-backend/dist

            echo "📦 Install dependencies"
            pnpm install --frozen-lockfile

            echo "🧬 Generate Prisma client"
            pnpm --filter @repo/db exec prisma generate
            
            echo "🔧 Build validator package"
            pnpm --filter @repo/validator build

            echo "🔧 Build db package"
            pnpm --filter @repo/db build

            echo "🔧 Build backend"
            pnpm --filter kbdl-backend build

            echo "🗄 Run Prisma migrations"
            pnpm --filter @repo/db exec prisma migrate deploy

            echo "🚀 Restart app"
            pm2 delete backend || true

            pm2 start apps/kbdl-backend/dist/server.js \
              --name backend \
              --node-args="--env-file=apps/kbdl-backend/.env"

            echo "💾 Save PM2"
            pm2 save

            echo "📊 PM2 Status"
            pm2 list

            echo "✅ Done"