name: Deploy Backend (Turborepo)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IP }}
          username: azureuser
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            # Ensure global binaries are available
            export PATH="$PATH:/usr/local/bin"

            cd ~/app/kbdl/kbdl-turborepo

            echo "📥 Pull latest"
            git fetch origin
            git reset --hard origin/main

            echo "📦 Install dependencies"
            # Pure pnpm! No global sudo commands needed.
            pnpm install --frozen-lockfile

            echo "🧬 Generate Prisma client"
            pnpm --filter @repo/db exec prisma generate

            echo "🗄 Run Prisma migrations"
            pnpm --filter @repo/db exec prisma migrate deploy

            echo "🚀 Restart app"
            # Delete the old process so it doesn't conflict
            pm2 delete backend || true 
            
            # Start the app using the local tsx binary installed by pnpm!
            pm2 start apps/kbdl-backend/src/server.ts --name backend --interpreter ./node_modules/.bin/tsx

            echo "✅ Done"
