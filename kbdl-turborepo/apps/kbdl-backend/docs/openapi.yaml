openapi: 3.0.3
info:
  title: KBDL Backend API
  version: 1.0.0
  description: |
    Baseline OpenAPI contract for the KBDL backend **before** the Company/CompanyMember
    schema refactor. Use this to compare response shapes after the migration.

    ## Response envelope
    All JSON endpoints use:
    - Success: `{ success: true, message, data, meta? }`
    - Error: `{ success: false, error: { code, message, details? } }`

    ## Auth
    Send `Authorization: Bearer <accessToken>` or cookie `accessToken`.
    Refresh endpoints use Bearer refresh token or cookie `refreshToken`.
  contact:
    name: KBDL Backend

servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.kaambadlo.com
    description: Production (if applicable)

tags:
  - name: Health
  - name: Auth
  - name: Profile
  - name: ShiftSwap
  - name: Operations
  - name: Jobs
  - name: Notifications
  - name: Leads
  - name: Uploads
    description: |
      Two APIs only: POST /uploads (multipart file) and POST /uploads/read-url ({ fileKey } → 5-min URL).
      Save `fileKey` from upload response in your DB.

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Server is running
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      message:
                        example: Server is running
                      data:
                        nullable: true
                        example: null

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /api/v1/auth/register/user:
    post:
      tags: [Auth]
      summary: Start user registration (send OTP)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_no]
              properties:
                phone_no:
                  type: string
                  example: '9876543210'
                name:
                  type: string
                preferences:
                  type: object
                  properties:
                    language:
                      type: string
                    theme:
                      type: string
                      enum: [light, dark, system]
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessNull'
        '409':
          $ref: '#/components/responses/Error'

  /api/v1/auth/register/user/verify:
    post:
      tags: [Auth]
      summary: Verify user registration OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_no, otp]
              properties:
                phone_no:
                  type: string
                otp:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      message:
                        example: User Created
                      data:
                        $ref: '#/components/schemas/UserAuthPayload'

  /api/v1/auth/register/employer:
    post:
      tags: [Auth]
      summary: Start employer registration (send OTP to email)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_name, email, phone_no]
              properties:
                company_name:
                  type: string
                email:
                  type: string
                  format: email
                phone_no:
                  type: string
                company_address:
                  type: string
                gst_number:
                  type: string
                subscription_tier:
                  type: string
                company_location:
                  type: object
                  properties:
                    lat:
                      type: number
                    lng:
                      type: number
      responses:
        '201':
          description: OTP sent (data is a string message in current API)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      message:
                        example: Org Created
                      data:
                        type: string
                        example: OTP sent to employer@example.com

  /api/v1/auth/register/employer/verify:
    post:
      tags: [Auth]
      summary: Verify employer registration OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
      responses:
        '201':
          description: Employer created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EmployerAuthPayload'

  /api/v1/auth/user/send-otp:
    post:
      tags: [Auth]
      summary: Send login OTP to user phone
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessNull'

  /api/v1/auth/user/verify-otp:
    post:
      tags: [Auth]
      summary: Verify user login OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otp]
              properties:
                phone:
                  type: string
                otp:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserAuthPayload'

  /api/v1/auth/user/token-refresh:
    post:
      tags: [Auth]
      summary: Refresh user access token
      security:
        - bearerAuth: []
        - cookieRefreshAuth: []
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserAuthPayload'

  /api/v1/auth/employer/send-otp:
    post:
      tags: [Auth]
      summary: Send login OTP to employer email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessNull'

  /api/v1/auth/employer/verify-otp:
    post:
      tags: [Auth]
      summary: Verify employer login OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                otp:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EmployerAuthPayload'

  /api/v1/auth/employer/token-refresh:
    post:
      tags: [Auth]
      summary: Refresh employer access token
      security:
        - bearerAuth: []
        - cookieRefreshAuth: []
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EmployerAuthPayload'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout (clear cookies)
      security: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessNull'

  # ---------------------------------------------------------------------------
  # Profile — User
  # ---------------------------------------------------------------------------
  /api/v1/profile/users/me:
    get:
      tags: [Profile]
      summary: Get current user profile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
    patch:
      tags: [Profile]
      summary: Update current user profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                default_address:
                  type: string
                experience:
                  type: integer
                city:
                  type: string
                area:
                  type: string
                skills:
                  type: array
                  items:
                    type: string
                extra_shift:
                  type: boolean
                preferences:
                  type: object
                location:
                  $ref: '#/components/schemas/LatLng'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
    delete:
      tags: [Profile]
      summary: Delete current user profile
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string

  /api/v1/profile/users/me/skills:
    patch:
      tags: [Profile]
      summary: Update user skills
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skills]
              properties:
                skills:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'

  /api/v1/profile/users/me/preferences:
    patch:
      tags: [Profile]
      summary: Update user preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language, theme]
              properties:
                language:
                  type: string
                theme:
                  type: string
                  enum: [light, dark, system]
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'

  /api/v1/profile/users/me/location:
    patch:
      tags: [Profile]
      summary: Update user location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LatLng'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'

  /api/v1/profile/users/me/availability:
    patch:
      tags: [Profile]
      summary: Update extra_shift availability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [extra_shift]
              properties:
                extra_shift:
                  type: boolean
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'

  /api/v1/profile/users/me/push-token:
    post:
      tags: [Profile]
      summary: Register push token (profile)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushTokenInput'
      responses:
        '200':
          description: Token registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
    delete:
      tags: [Profile]
      summary: Remove push token (profile)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                deviceId:
                  type: string
      responses:
        '200':
          description: Token removed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string

  /api/v1/profile/users/{id}:
    get:
      tags: [Profile]
      summary: Get public user profile by id
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Public user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'

  # ---------------------------------------------------------------------------
  # Profile — Employer
  # ---------------------------------------------------------------------------
  /api/v1/profile/employers/me:
    get:
      tags: [Profile]
      summary: Get current employer profile
      responses:
        '200':
          description: Employer profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Employer'
    patch:
      tags: [Profile]
      summary: Update current employer profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                company_name:
                  type: string
                phone_no:
                  type: string
                company_address:
                  type: string
                gst_number:
                  type: string
      responses:
        '200':
          description: Updated employer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Employer'
    delete:
      tags: [Profile]
      summary: Delete current employer profile
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string

  /api/v1/profile/employers/me/preferences:
    patch:
      tags: [Profile]
      summary: Update employer preferences
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Updated employer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Employer'

  /api/v1/profile/employers/me/location:
    patch:
      tags: [Profile]
      summary: Update employer location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LatLng'
      responses:
        '200':
          description: Updated employer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Employer'

  /api/v1/profile/employers/me/documents:
    post:
      tags: [Profile]
      summary: Upload employer verification documents
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '202':
          description: Documents accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /api/v1/profile/employers/me/verification-status:
    get:
      tags: [Profile]
      summary: Get employer verification status (works while unverified)
      responses:
        '200':
          description: Verification status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          is_verified:
                            type: boolean

  /api/v1/profile/employers/{id}:
    get:
      tags: [Profile]
      summary: Get public employer profile by id
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Public employer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Employer'

  # ---------------------------------------------------------------------------
  # Shift swap
  # ---------------------------------------------------------------------------
  /api/v1/shift-swap:
    post:
      tags: [ShiftSwap]
      summary: Create shift swap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShiftBody'
      responses:
        '201':
          description: Shift created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Shift'
    patch:
      tags: [ShiftSwap]
      summary: Update shift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shift_id]
              properties:
                shift_id:
                  type: string
                  format: uuid
                shift_date:
                  type: string
                  format: date-time
                shift_start:
                  type: string
                  format: date-time
                shift_end:
                  type: string
                  format: date-time
                skill_required:
                  type: string
                replacement_employee_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Shift updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Shift'

  /api/v1/shift-swap/accept:
    post:
      tags: [ShiftSwap]
      summary: Accept invited shift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shift_id]
              properties:
                shift_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Shift'

  /api/v1/shift-swap/apply:
    post:
      tags: [ShiftSwap]
      summary: Apply for public shift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shift_id]
              properties:
                shift_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Application created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ShiftApplication'

  /api/v1/shift-swap/withdraw:
    post:
      tags: [ShiftSwap]
      summary: Withdraw shift application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shift_application_id]
              properties:
                shift_application_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ShiftApplication'

  /api/v1/shift-swap/sync-saved:
    post:
      tags: [ShiftSwap]
      summary: Sync saved shift ids
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shift_ids]
              properties:
                shift_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Synced shifts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Shift'

  /api/v1/shift-swap/cancel:
    post:
      tags: [ShiftSwap]
      summary: Cancel shift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shift_id]
              properties:
                shift_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Shift'

  /api/v1/shift-swap/reject:
    post:
      tags: [ShiftSwap]
      summary: Reject shift application (employer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shift_application_id]
              properties:
                shift_application_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ShiftApplication'

  /api/v1/shift-swap/rate:
    post:
      tags: [ShiftSwap]
      summary: Rate a shift worker (employer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shift_id, user_id, score]
              properties:
                shift_id:
                  type: string
                  format: uuid
                user_id:
                  type: string
                  format: uuid
                score:
                  type: integer
                  minimum: 1
                  maximum: 5
                review:
                  type: string
                flagged_issue:
                  type: boolean
                is_absent:
                  type: boolean
      responses:
        '201':
          description: Rating created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Rating'

  /api/v1/shift-swap/referred-employee:
    post:
      tags: [ShiftSwap]
      summary: Lookup / refer employee by phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_no]
              properties:
                phone_no:
                  type: string
      responses:
        '200':
          description: Employee id
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid

  /api/v1/shift-swap/employee:
    get:
      tags: [ShiftSwap]
      summary: Get employee shifts
      responses:
        '200':
          description: Shifts list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
