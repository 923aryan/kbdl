  # ---------------------------------------------------------------------------
  # Leads
  # ---------------------------------------------------------------------------
  /api/v1/leads:
    post:
      tags: [Leads]
      summary: Create lead (public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, mobileNumber, subject, message]
              properties:
                fullName:
                  type: string
                email:
                  type: string
                  format: email
                mobileNumber:
                  type: string
                subject:
                  type: string
                message:
                  type: string
      responses:
        '201':
          description: Lead created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Lead'
    get:
      tags: [Leads]
      summary: List leads (admin)
      responses:
        '200':
          description: Leads
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Lead'

  /api/v1/leads/{id}:
    get:
      tags: [Leads]
      summary: Get lead by id (admin)
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Lead
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Lead'
    delete:
      tags: [Leads]
      summary: Delete lead (admin)
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Lead'

  /api/v1/leads/{id}/resolve:
    patch:
      tags: [Leads]
      summary: Resolve lead (admin)
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Lead'

  # ---------------------------------------------------------------------------
  # Uploads (only 2 APIs)
  # ---------------------------------------------------------------------------
  /api/v1/uploads:
    post:
      tags: [Uploads]
      summary: Upload a file (choose file in Swagger)
      description: |
        Multipart: `type` + `file`. Stored in private S3.
        Save returned `fileKey` in your DB. Use it later with `/uploads/read-url`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, file]
              properties:
                type:
                  type: string
                  enum: [userProfile, userPrivateDocs, userFiles]
                  description: userProfile ≤2MB · userPrivateDocs ≤5MB · userFiles ≤25MB
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UploadAsset'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'

  /api/v1/uploads/read-url:
    post:
      tags: [Uploads]
      summary: Get 5-minute signed URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileKey]
              properties:
                fileKey:
                  type: string
                  example: profiles/user/uuid/2026/08/uuid-avatar.jpg
      responses:
        '200':
          description: Temporary download URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          fileKey:
                            type: string
                          downloadUrl:
                            type: string
                            format: uri
                          expiresInSeconds:
                            type: integer
                            example: 300
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (or refresh token on refresh endpoints)
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
    cookieRefreshAuth:
      type: apiKey
      in: cookie
      name: refreshToken

  parameters:
    UuidId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    JobSuccess:
      description: Job success
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccess'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Job'
    JobApplicationSuccess:
      description: Job application success
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccess'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/JobApplication'

  schemas:
    ApiSuccess:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data: {}
        meta:
          type: object
          additionalProperties: true

    ApiSuccessNull:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              nullable: true
              example: null

    ApiSuccessPaginated:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            meta:
              $ref: '#/components/schemas/PaginationMeta'

    ApiError:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - UNVERIFIED
                - NOT_FOUND
                - DUPLICATE_ERROR
                - TOO_MANY_REQUESTS
                - INTERNAL_SERVER_ERROR
            message:
              type: string
            details: {}

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer

    LatLng:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
        longitude:
          type: number

    User:
      type: object
      description: Baseline User DTO (pre CompanyMember refactor)
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        karigari_id:
          type: string
          nullable: true
        phone_no:
          type: string
        default_address:
          type: string
          nullable: true
        skills:
          type: array
          items:
            type: string
        experience:
          type: integer
          nullable: true
        city:
          type: string
          nullable: true
        area:
          type: string
          nullable: true
        preferences: {}
        location:
          nullable: true
        role:
          type: string
        rating_avg:
          type: number
          nullable: true
        rating_count:
          type: integer
          nullable: true
        verification_level:
          type: integer
          nullable: true
        extra_shift:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Employer:
      type: object
      description: Baseline Employer DTO (pre CompanyMember refactor)
      properties:
        id:
          type: string
          format: uuid
        company_name:
          type: string
        email:
          type: string
        preferences: {}
        company_address:
          type: string
          nullable: true
        company_location:
          nullable: true
        phone_no:
          type: string
        subscription_tier:
          type: string
          nullable: true
        gst_number:
          type: string
          nullable: true
        is_verified:
          type: boolean
        role:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserAuthPayload:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
        refreshToken:
          type: string

    EmployerAuthPayload:
      type: object
      properties:
        employer:
          $ref: '#/components/schemas/Employer'
        accessToken:
          type: string
        refreshToken:
          type: string

    ShiftStatus:
      type: string
      enum: [open, approved, completed, cancelled, absent, rejected]

    PayType:
      type: string
      enum: [HOURLY, FIXED]

    UserType:
      type: string
      enum: [employer, user]

    Shift:
      type: object
      description: Baseline Shift shape (employer_id still present)
      properties:
        id:
          type: string
          format: uuid
        original_employee_id:
          type: string
          format: uuid
        replacement_employee_id:
          type: string
          format: uuid
          nullable: true
        employer_id:
          type: string
          format: uuid
        request_accepted:
          type: boolean
        created_by:
          $ref: '#/components/schemas/UserType'
        shift_date:
          type: string
          format: date-time
        shift_start:
          type: string
          format: date-time
        shift_end:
          type: string
          format: date-time
        payType:
          $ref: '#/components/schemas/PayType'
        shift_pay:
          type: number
        skill_required:
          type: string
        status:
          $ref: '#/components/schemas/ShiftStatus'
        organization_approved:
          type: boolean
        no_show_reported:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ShiftApplication:
      type: object
      properties:
        id:
          type: string
          format: uuid
        shift_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [invited, applied]
        status:
          type: string
          enum: [pending, accepted, rejected, withdrawn]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateShiftBody:
      type: object
      required: [payType, shift_pay, shift_date, shift_start, shift_end, skill_required]
      properties:
        payType:
          $ref: '#/components/schemas/PayType'
        shift_pay:
          type: number
        shift_date:
          type: string
          format: date-time
        shift_start:
          type: string
          format: date-time
        shift_end:
          type: string
          format: date-time
        skill_required:
          type: string
        original_employee_id:
          type: string
          format: uuid
        replacement_employee_id:
          type: string
          format: uuid

    Rating:
      type: object
      properties:
        id:
