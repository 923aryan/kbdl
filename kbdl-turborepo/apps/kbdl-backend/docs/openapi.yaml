  /api/v1/operations/employer/onboard:
    post:
      tags: [Operations]
      summary: Create / onboard employee (full HR form)
      description: |
        JSON only — document fields are **https URLs** (no multipart).

        Validation highlights:
        - `phone_no`: 10-digit Indian mobile (or `+91` + 10 digits)
        - `personal.date_of_birth`: YYYY-MM-DD, **not future**, age ≥ 14
        - `job.joining_date`: YYYY-MM-DD, past or future OK (max +1 year)
        - Amounts / experience: **non-negative**; salary & wage **> 0**
        - `action=submit` requires full personal, job, payment, identity
        - `action=draft` allows partial fields (still validates formats when present)
        - Probation stage when submit includes aadhaar + pan + identity + additional doc URLs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardEmployeeRequest'
            example:
              action: submit
              phone_no: '9876543210'
              employee_no: EMP1001
              personal:
                full_name: Aman Kumar
                email: aman@example.com
                date_of_birth: '1998-06-15'
                gender: male
                address: Sector 17, Chandigarh
                blood_group: O+
                emergency_contact:
                  name: Ravi Kumar
                  relation: Father
                  phone_no: '9876543211'
              job:
                designation_id: 11111111-1111-1111-1111-111111111111
                department_id: 22222222-2222-2222-2222-222222222222
                branch_location: Chandigarh
                reporting_supervisor_id: 33333333-3333-3333-3333-333333333333
                employee_type: full_time
                joining_date: '2026-08-01'
                work_shift_id: 44444444-4444-4444-4444-444444444444
                skill_trade: Electrical
                experience_years: 3
                safety_training_completed: true
              payment:
                method: bank
                basic_salary: 35000
                salary_type: monthly
                payment_frequency: monthly
                overtime_eligible: true
                pf_applicable: true
                esi_applicable: false
                bank:
                  account_holder_name: Aman Kumar
                  account_number: '123456789012'
                  bank_name: HDFC Bank
                  ifsc_code: HDFC0001234
              identity:
                aadhaar_number: '123456789012'
                pan_number: ABCDE1234F
                identity_document_url: https://example.com/docs/aman-id.pdf
                additional_document_url: https://example.com/docs/aman-extra.pdf
      responses:
        '201':
          description: Employee created / onboarded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EmployeeEmployment'

