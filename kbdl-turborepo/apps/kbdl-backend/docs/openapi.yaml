    OnboardEmployeeRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [draft, submit]
          default: submit
        phone_no:
          type: string
          description: 10-digit mobile or +91XXXXXXXXXX
          example: '9876543210'
        karigari_id:
          type: string
        employee_no:
          type: string
          maxLength: 50
        notes:
          type: string
          maxLength: 2000
        personal:
          type: object
          properties:
            full_name:
              type: string
            email:
              type: string
              format: email
            date_of_birth:
              type: string
              format: date
              description: YYYY-MM-DD; not future; age ≥ 14
            gender:
              type: string
              enum: [male, female, other]
            address:
              type: string
            blood_group:
              type: string
              enum: [A+, A-, B+, B-, AB+, AB-, O+, O-]
            emergency_contact:
              type: object
              properties:
                name:
                  type: string
                relation:
                  type: string
                phone_no:
                  type: string
                  description: 10-digit phone
        job:
          type: object
          properties:
            designation_id:
              type: string
              format: uuid
              description: FK → company_designations (job title, not RBAC)
            department_id:
              type: string
              format: uuid
              description: FK → departments (company-scoped)
            branch_location:
              type: string
            reporting_supervisor_id:
              type: string
              format: uuid
              description: FK → company_members.id (manager self-join)
            employee_type:
              type: string
              enum: [full_time, contract, worker, trainee]
            joining_date:
              type: string
              format: date
              description: YYYY-MM-DD; past or future allowed (max +1 year)
            work_shift_id:
              type: string
              format: uuid
              description: FK → work_shifts (HR templates)
            work_location:
              type: string
            skill_trade:
              type: string
            experience_years:
              type: number
              minimum: 0
              maximum: 60
            certification_licenses:
              type: string
            safety_training_completed:
              type: boolean
        payment:
          type: object
          properties:
            method:
              type: string
              enum: [cash, upi, bank]
            basic_salary:
              type: number
              exclusiveMinimum: 0
            salary_type:
              type: string
              enum: [monthly, daily_wage, hourly]
            payment_frequency:
              type: string
              enum: [daily, weekly, biweekly, monthly]
            overtime_eligible:
              type: boolean
            pf_applicable:
              type: boolean
            esi_applicable:
              type: boolean
            upi:
              type: object
              properties:
                upi_id:
                  type: string
                name:
                  type: string
                wage_amount:
                  type: number
                  exclusiveMinimum: 0
                frequency:
                  type: string
                  enum: [daily, weekly, biweekly, monthly]
            bank:
              type: object
              properties:
                account_holder_name:
                  type: string
                account_number:
                  type: string
                  description: 9–18 digits only
                bank_name:
                  type: string
                ifsc_code:
                  type: string
        identity:
          type: object
          description: Document fields are https links only (no multipart)
          properties:
            aadhaar_number:
              type: string
              pattern: '^[0-9]{12}$'
            pan_number:
              type: string
              pattern: '^[A-Z]{5}[0-9]{4}[A-Z]$'
            driving_license_number:
              type: string
            identity_document_url:
              type: string
              format: uri
            additional_document_url:
              type: string
              format: uri

