# Minimal stack: PostGIS + Redis + backend (backend-only Docker build — no Next.js apps)
#
# Infra only (PG + Redis):
#   docker compose up -d postgres redis
#
# Full stack (recommended on AWS):
#   docker compose up -d --build
#   docker compose run --rm backend seed
#
# Host-side backend (local PC) uses DATABASE_URL / REDIS_URL in .env → REMOTE_DOCKER_HOST.
# Backend container overrides those to postgres/redis service names (see backend.environment).

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: kbdl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kbdl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kbdl}
    ports:
      - "0.0.0.0:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kbdl_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-postgis.sql:/docker-entrypoint-initdb.d/01-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: kbdl-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
        "--bind",
        "0.0.0.0",
      ]
    ports:
      - "0.0.0.0:${REDIS_PORT:-6379}:6379"
    volumes:
      - kbdl_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kbdl-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "0.0.0.0:${PORT:-8000}:8000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8000}
      # Inside Docker network — ignore REMOTE_DOCKER_HOST / .env public IP
      DATABASE_URL: postgresql://${POSTGRES_USER:-kbdl}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kbdl}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-kbdl}
      PGDATABASE: ${POSTGRES_DB:-kbdl}
      PRISMA_APPLY_MODE: ${PRISMA_APPLY_MODE:-push}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  kbdl_pgdata:
  kbdl_redisdata:
