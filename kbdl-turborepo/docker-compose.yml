# Local stack: PostGIS + Redis + KBDL backend
#
# 1) create/edit kbdl-turborepo/.env (POSTGRES_*, REDIS_*, JWT_*, S3_*, …)
# 2) docker compose up --build
# 3) docker compose run --rm backend seed
#
# API:  http://localhost:8000
# Docs: http://localhost:8000/api/docs

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: kbdl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kbdl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kbdl}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kbdl_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-postgis.sql:/docker-entrypoint-initdb.d/01-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: kbdl-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - kbdl_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kbdl-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-8000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kbdl}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kbdl}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-7d}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-14d}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY in .env}
      EMPLOYER_URL: ${EMPLOYER_URL:-http://localhost:3002}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:?Set GEOAPIFY_API_KEY in .env}
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      S3_BUCKET: ${S3_BUCKET:-hrms-documents-123456}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      SEED_ON_START: ${SEED_ON_START:-false}
      # push = db push on start (Docker dev, after reset-seed). migrate = migrate deploy (prod).
      PRISMA_APPLY_MODE: ${PRISMA_APPLY_MODE:-push}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-kbdl}
      PGDATABASE: ${POSTGRES_DB:-kbdl}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  kbdl_pgdata:
  kbdl_redisdata:
